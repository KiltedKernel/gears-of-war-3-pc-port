; Gears of War 1, act 1 chapter 1 ("14 Years After": the prison), as a chapter of its own in Gears 3's campaign (Act
; VI in Campaign > Select Chapter), from the player's own Gears of War 1 and Gears of War 3 discs:
;   python -P tools/trilogy.py build gears1_ch1
; Every Gears 1 package of the level becomes a Gears 3 package named GOW1_<name> (docs/TRILOGY.md, "A chapter's
; packages"); Gears 1's own Kismet streams them in and out as it did on the Xbox 360.

[mod]
folder = Gears1_Chapter1
name = Gears of War: 14 Years After (trilogy)
version = 0.1
description = Gears of War 1's first chapter, the prison, from your Gears 1 disc: Act VI chapter 1 in Select Chapter.
; converted levels are packages: every player of a co-op session needs the same ones
side = everyone

[chapter]
number = 32
act = 6
act_title = Gears of War
title = 14 Years After
location = Jacinto Maximum Security Prison
time = Emergence Day + 14 years
prefix = GOW1_
; the persistent level (its Kismet streams the others)
persistent = SP_Prison_P
; every other package of the level, in Gears 1's streaming list (SP_Prison_Tower holds nothing: left out)
sections = SP_Prison_S01, SP_Prison_S01_Scripting, SP_Prison_S01_Audio, SP_Prison_S02, SP_Prison_S02_Meshes,
           SP_Prison_S02_Scripting, SP_Prison_S02_Audio, SP_Prison_S03, SP_Prison_S04, SP_Prison_S04_Scripting,
           SP_Prison_S04_Audio, SP_Prison_S05, SP_Prison_S05_Meshes, SP_Prison_S05_Scripting, SP_Prison_S05_Audio,
           SP_Prison_S06, SP_Prison_S06_Scripting, SP_Prison_S06_Audio, SP_Prison_S07, SP_Prison_World,
           SP_Prison_Audio, SP_Prison_Cine_Start, SP_Prison_Cine_End
; the kit: the persistent level's Gears 3 template (its material instances are the converted materials' parents)
kit = SP_Nightmare_02_S
materials = MI_GR_Cliffwall_Tilable_01
; each section's template: a small Gears 3 sublevel (736 KB), blanked
section_template = SP_Char_Tower_1a_S
; the post-process the chapter starts from (Gears 1's values on top)
look = SP_Nightmare_P
; the Gears 3 packages whose characters are loaded with the chapter (Dom: GEARGAMESP_SF)
content = GEARGAMESP_SF
; carriers: Gears 3 levels streamed in (actors and scripts off) for the characters cooked into them: the campaign's
; Drone (GearPawn_LocustDroneSavage, Gears 1's Pawn_GeistLocust; the classic Drone is cooked only for Horde)
carriers = SP_Airfield_02_S
; levelinject options of every section
options = --bsp --replace --cover --kismet

; navmesh regions: the region's geometry converted again into a multiplayer map's slot (20000 up), Gears 3's builder
; run there in the game, the mesh moved back down into the pylon of `section` (placed at pylon_at)
[navmesh cellblock]
; the cell block and the two routes out of it (Gears 1's route nodes as seeds: the easy route upstairs, the hard
; route below)
section = SP_Prison_S02_Scripting
pylon_at = 150,940,150
pylon_radius = 6000
pylons_at = -1441,1975,178;-4840,2200,982;-976,460,633;-2908,-8,971;-5096,1029,818
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_P, SP_Prison_S01, SP_Prison_S02, SP_Prison_S02_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=150,687,20272,16404
seconds = 150

[navmesh yard]
; the prison yard (S03, S04): the first fight
section = SP_Prison_S04_Scripting
pylon_at = -3170,4328,800
pylon_radius = 6000
pylons_at = -3208,2600,800;-1500,2600,160;-1600,6000,160;-3300,6300,800
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_S02_Meshes, SP_Prison_S03, SP_Prison_S04
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=-3330,4215,20848,16384
seconds = 150

[navmesh s05]
; past the yard: the welding door
section = SP_Prison_S05_Scripting
pylon_at = -2496,8288,306
pylon_radius = 6000
pylons_at = -4800,7616,646;-1349,6794,236;-975,7965,236;-3264,8224,341
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_S05, SP_Prison_S05_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=-2496,8288,20356,0
seconds = 150

[navmesh s06]
; the last stretch to the prison's exit
section = SP_Prison_S06_Scripting
pylon_at = 1456,8693,154
pylon_radius = 6000
pylons_at = -83,8529,134;3056,8992,146;1490,6816,266
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_S06, SP_Prison_S07, SP_Prison_World
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=1456,8693,20254,0
seconds = 150
