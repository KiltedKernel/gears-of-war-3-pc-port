; Gears of War 1, act 1 chapter 2 ("Trial by Fire": Embry Square), as a chapter of its own in Gears 3's campaign (Act
; VI chapter 2 in Select Chapter), from the player's own Gears of War 1 and Gears of War 3 discs:
;   python -P tools/trilogy.py build gears1_ch2
; (the shared settings as gears1_ch1.ini, which explains them)

[mod]
folder = Gears1_Chapter2
name = Gears of War: Trial by Fire (trilogy)
version = 0.1
description = Gears of War 1's second chapter, Embry Square, from your Gears 1 disc: Act VI chapter 2 in Select Chapter.
side = everyone

[chapter]
number = 33
act = 6
act_title = Gears of War
title = Trial by Fire
location = Embry Square
time = Emergence Day + 14 years
prefix = GOW1_
persistent = SP_Embry_P
; Gears 1's streaming list (the prison's map change loads the first four with the persistent level)
sections = SP_Embry_S01_1stLanding, SP_Embry_S02_2ndLanding, SP_Embry_Backdrop, SP_Embry_Scripting_01,
           SP_Embry_Scripting_02, SP_Embry_Scripting_03, SP_Embry_Scripting_04, SP_Embry_Scripting_05,
           SP_Embry_S03_TempleFront, SP_Embry_S04_Temple, SP_Embry_S05_Detail, SP_Embry_S05_Manholes,
           SP_Embry_S05_Manholes_Front, SP_Embry_S06_Columns, SP_Embry_S07_Ruins, SP_Embry_S07_Ruins_End,
           SP_Embry_S07_Ruinsa, SP_Embry_S07_Ruinsb, SP_Embry_Worldb, SP_Embry_Audio, SP_Embry_FrontDetail,
           SP_Embry_Start_Cinematic, SP_Embry_Ehole_Cine
; sections no Kismet streams (Gears 1's LevelStreamingVolumes only: 27 in the persistent level)
always_loaded = SP_Embry_S01_1stLanding, SP_Embry_S02_2ndLanding, SP_Embry_S05_Manholes_Front, SP_Embry_S06_Columns,
                SP_Embry_Scripting_03
kit = SP_Nightmare_02_S
materials = MI_GR_Cliffwall_Tilable_01
skin_material = GEARGAMESP_SF: ALL_WeaponShaders.SinglePlayer.COG_WeaponShader_HOD_SP
max_texture = 512
max_character_texture = 1024
light_scale = 0.25
; outdoors: Gears 1 lit the characters with its sun, which does nothing on them here; its other lights reach this far
; instead (docs/ENGINEERING_LOG.md, 2026-10-25)
light_radius_min = 20000
masked_template = SP_Azura2_02_S
masked_material = MI_COG_Collectibles_Azura
masked_sections = SP_Embry_S01_1stLanding, SP_Embry_S02_2ndLanding, SP_Embry_S03_TempleFront, SP_Embry_S04_Temple,
                  SP_Embry_S05_Detail, SP_Embry_S05_Manholes, SP_Embry_S05_Manholes_Front, SP_Embry_S06_Columns,
                  SP_Embry_S07_Ruins, SP_Embry_S07_Ruinsa, SP_Embry_S07_Ruinsb, SP_Embry_FrontDetail, SP_Embry_Backdrop
facefx_assets = marcus_FaceFX = MPCH_COGMarcusG2MP_SF: COG_MarcusFenix.marcus_FaceFX, Dom_FaceFX = MPCH_COGDomG2MP_SF: COG_Dom.Dom_FaceFX
hair_material = MPCH_COGDomG2MP_SF: COG_Dom.Game.M_Classic_Dom_Hair_Masked
section_template = SP_Char_Tower_1a_S
look = SP_Nightmare_P
pawn_classes = Pawn_COGDom=GearPawn_COGDomG2
; the persistent level's squad factories (Dom, Carmine, Minh: SpawnSquad) resolve their classes before the carriers load:
; classes of load_packages there (Carmine: Gears 3's multiplayer Anthony Carmine, Gears 1's; Minh: a multiplayer Redshirt)
persistent_pawn_classes = Pawn_COGDom=GearPawn_COGDomG2MP, Pawn_COGCarmine=GearPawn_COGCarmineMP, Pawn_COGMinh=GearPawn_COGRedshirtMP
; the player as Gears 3's classic Marcus once Hoffman's opening cutscene (HOFFMAN_CINEMATIC) ends
player_pawn = GearPawn_COGMarcusG2MP @ SP_Embry_Start_Cinematic: HOFFMAN_CINEMATIC.SeqAct_Interp_0: Completed
; where the classic one spawns (x,y,z,yaw degrees): beside the chapter's player start (10364,-40032,-1325, yaw 122),
; which the old pawn stands on (without it the factory ran and no pawn came: the player start's import)
player_spawn_at = 10464,-40032,-1300,122
load_packages = MPCH_COGDomG2MP_SF, MPCH_COGMarcusG2MP_SF, MPCH_COGCarmineMP_SF, MPCH_COGRedshirtMP_SF
content = GEARGAMESP_SF
; the Drone (SP_Airfield_02_S); the flashback Dom and Ben Carmine (SP_Nightmare_P)
; and the Troika (Turret_TroikaCabal, with Gears 3's model and animations: SP_Airfield_01B_S)
carriers = SP_Airfield_02_S, SP_Nightmare_P, SP_Airfield_01B_S
options = --bsp --replace --cover --kismet --merge

; navmesh regions (as gears1_ch1.ini's: the region converted again into a multiplayer slot at 20000 up, Gears 3's builder
; run there, the mesh moved back into the section's pylon). Seeds: Gears 1's path nodes, spread out
[navmesh landing1]
; the first landing (the start, the first Drones)
section = SP_Embry_Scripting_01
pylon_at = 10528,-36857,-1153
pylon_radius = 6000
pylons_at = 9124,-41675,-1374;13248,-33088,-724;10320,-39392,-1358;13188,-35472,-709;11137,-34152,-724
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Embry_P, SP_Embry_S01_1stLanding, SP_Embry_S02_2ndLanding
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=10364,-40032,18700,22161
seconds = 300

[navmesh landing2]
; the second landing (the stairs, the helicopter and Drones above)
section = SP_Embry_Scripting_02
; the main seed over the second landing's floor, Gears 1's terrain (at 9000,-31500 its only surface: z -140; a vertical
; ray through every package), 30 over it (written 20 higher: seeds_on_path_nodes lowers every seed by 20)
pylon_at = 9000,-31500,-90
pylon_radius = 6000
pylons_at = 9881,-24832,-101;13338,-34369,-720;7137,-27168,-87;7938,-33442,-78;12543,-31704,-87
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
; the second landing's own section (with all seven sources, 141 MB, the builder found no collision at all)
sources = SP_Embry_S02_2ndLanding
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=9000,-31500,19950,0
seconds = 900  ; (the first pass alone: 11592 polygons; the merge passes took longer than 300 s)
; the seeds are Gears 1 path nodes over mesh floors (BSP lies under them): 20 units under each node
seeds_on_path_nodes = true
