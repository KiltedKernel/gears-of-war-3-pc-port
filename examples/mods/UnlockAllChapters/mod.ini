; Unlocks every chapter of the campaign in Campaign > Standard / Arcade > Select Chapter, without playing through.
; It sets GearCampaignChapterData.IsAlwaysUnlocked (the flag Act 1's first chapter has on the disc) on chapters 1-30;
; GearProfileSettings.HasChapterBeenUnlockedForAccess and the Select Chapter screen both honour it. Saves are untouched:
; turn the mod off and the chapters are locked again.
[mod]
name = Unlock all chapters
version = 1.0
author = gears3-pc
description = Every campaign chapter can be picked in Select Chapter (config\unlock.ini).
priority = 0
enabled = true
side = client
