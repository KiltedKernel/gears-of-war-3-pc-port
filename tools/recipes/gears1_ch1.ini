; Gears of War 1, act 1 chapter 1 ("14 Years After": the prison), as a chapter of its own in Gears 3's campaign (Act
; VI in Campaign > Select Chapter), from the player's own Gears of War 1 and Gears of War 3 discs:
;   python -P tools/trilogy.py build gears1_ch1
; Every Gears 1 package of the level becomes a Gears 3 package named GOW1_<name> (docs/TRILOGY.md, "A chapter's
; packages"); Gears 1's own Kismet streams them in and out as it did on the Xbox 360.

[mod]
folder = Gears1_Chapter1
name = Gears of War: 14 Years After (trilogy)
version = 0.1
description = Gears of War 1's first chapter, the prison, from your Gears 1 disc: Act VI chapter 1 in Select Chapter.
; converted levels are packages: every player of a co-op session needs the same ones
side = everyone

[chapter]
number = 32
act = 6
act_title = Gears of War
title = 14 Years After
location = Jacinto Maximum Security Prison
time = Emergence Day + 14 years
prefix = GOW1_
; the persistent level (its Kismet streams the others)
persistent = SP_Prison_P
; the next chapter (tools/recipes/gears1_ch2.ini, built into the same mods folder first): Gears 1's map change at the
; prison's end goes to its persistent level; without it built the chapter ends the game
next = SP_Embry_P
next_folder = Gears1_Chapter2
; every other package of the level, in Gears 1's streaming list (SP_Prison_Tower holds nothing: left out)
sections = SP_Prison_S01, SP_Prison_S01_Scripting, SP_Prison_S01_Audio, SP_Prison_S02, SP_Prison_S02_Meshes,
           SP_Prison_S02_Scripting, SP_Prison_S02_Audio, SP_Prison_S03, SP_Prison_S04, SP_Prison_S04_Scripting,
           SP_Prison_S04_Audio, SP_Prison_S05, SP_Prison_S05_Meshes, SP_Prison_S05_Scripting, SP_Prison_S05_Audio,
           SP_Prison_S06, SP_Prison_S06_Scripting, SP_Prison_S06_Audio, SP_Prison_S07, SP_Prison_World,
           SP_Prison_Audio, SP_Prison_Cine_Start, SP_Prison_Cine_End
; sections streamed by Gears 1's LevelStreamingVolumes only (volumes are not converted): always loaded instead
always_loaded = SP_Prison_World
; the kit: the persistent level's Gears 3 template (its material instances are the converted materials' parents)
kit = SP_Nightmare_02_S
materials = MI_GR_Cliffwall_Tilable_01
; the converted characters' (cutscene meshes') material parent: a skinned Gears 3 shader in GEARGAMESP_SF (loaded with
; every campaign map). A weapon shader: with the character skin shaders (the kit's Boomer, GEARGAMESP_SF's
; M_COG_Dom_Summer_Game) the converted meshes drew flat white; with it the armour's detail shows (its colours are still
; wrong: docs/TRILOGY.md)
skin_material = GEARGAMESP_SF: ALL_WeaponShaders.SinglePlayer.COG_WeaponShader_HOD_SP
; converted textures' mips over 512 left out: they stay resident in Gears 3's 145 MB texture pool, and at full size (105 MB)
; the classic Marcus and Dom streamed in at their low mips (muddy) most of the time
max_texture = 512
; the cutscene characters' textures (Marcus, Dom, the bag, the Wretches: skeletal meshes' materials) at up to 1024: a few
; MB more in the pool; at 512 their armour and faces drew muddy beside Gears 1's
max_character_texture = 1024
; the copied lights' brightness (and the Matinee tracks animating it) times this: Gears 1's cutscene spotlights
; (brightness 9-20) composited into Gears 3's light environments lit the characters white (Gears 1 reference: Xenia)
light_scale = 0.25
; masked materials (fences, razor wire, grass; the see-through chain-link too, cut by its diffuse's alpha): each section
; drawing them is a clone of a Gears 3 level carrying a masked instance and its compiled shaders, and they become copies
; of that instance with its static permutation (a child instance drew the base material's default permutation: uncut)
masked_template = SP_Azura2_02_S
masked_material = MI_COG_Collectibles_Azura
; the level geometry's sections only: the cutscenes' (masked only for the characters' hair, which hair_material converts)
; cloned from that level drew no characters
masked_sections = SP_Prison_S01, SP_Prison_S02, SP_Prison_S02_Meshes, SP_Prison_S03, SP_Prison_S04, SP_Prison_S05_Meshes,
                  SP_Prison_S06, SP_Prison_S07
; masked character materials (Dom's and Marcus's hair cards: the cutout in the diffuse's alpha) as copies of the classic
; Dom's masked hair with its compiled permutation (its package is in load_packages); with the skin material they drew
; solid and light
; facial animation: the cutscene meshes' FaceFX actors are Gears 3's classic Marcus and Dom (Gears 1's own load no actor
; in Gears 3); Gears 1's FaceFX animation sets play on them (their curves name the same face graph nodes)
facefx_assets = marcus_FaceFX = MPCH_COGMarcusG2MP_SF: COG_MarcusFenix.marcus_FaceFX, Dom_FaceFX = MPCH_COGDomG2MP_SF: COG_Dom.Dom_FaceFX
hair_material = MPCH_COGDomG2MP_SF: COG_Dom.Game.M_Classic_Dom_Hair_Masked
; each section's template: a small Gears 3 sublevel (736 KB), blanked
section_template = SP_Char_Tower_1a_S
; the post-process the chapter starts from (Gears 1's values on top)
look = SP_Nightmare_P
; Gears 3's higher-quality characters for Gears 1's (docs/TRILOGY.md, roadmap A2): Dom as Gears 3's flashback Dom
; (GearPawn_COGDomG2, the campaign Dom with the classic armour; cooked into SP_Nightmare_P: carriers). The multiplayer
; classic Dom (GearPawn_COGDomG2MP) ran with his arms pumping and the rifle swinging in one hand once he re-equipped at
; the path choice, whatever the weapon (docs/ENGINEERING_LOG.md, 2026-10-22)
pawn_classes = Pawn_COGDom=GearPawn_COGDomG2
; the player as Gears 3's classic Marcus: a squad slot 1 factory once the opening cutscene ends (Class @ section: op: output)
player_pawn = GearPawn_COGMarcusG2MP @ SP_Prison_Cine_Start: SeqAct_Interp_0: Completed
; where the classic one spawns (x,y,z,yaw): in Marcus's cell beside its player start, which the old pawn stands on
; (Gears 1's cover point there: 101,591)
player_spawn_at = 105,595,192,90
; Matinee position keys moved from a time on (Group@time:x,y,z;...): the cell door's base is at the cell floor's height
; (z 112) and the opening swings it out over the corridor's step and floor (z 120, 124): lifted 13 while it turns its
; first 9 degrees, still over the threshold
track_offsets = Sol_doorMain@24.6:0,0,13
; Kismet object variables pointed at another actor (VarPathSuffix=Actor;...): Dom spawns where Gears 1's walk out of the
; cell ends (PathNode_4, down the corridor): his move from the cell door never starts in Gears 3 (his AI fails to
; anchor on the navmesh there) and he stood in the doorway, blocking the player
object_vars = time2Go.SeqVar_Object_0=PathNode_4
; actors that neither collide nor block (Section/Actor;...): the cell door, swung open by the opening, ends angled into
; the doorway (its free edge at about 69,917), where the player walking out of the cell caught on it
no_collision = SP_Prison_Cine_Start/InterpActor_0
; Kismet links moved to another output (SourcePackage/Op.Output>Op.Output:Target;...): the start runs
; initialPlayerStuff, whose checkpoint is the chapter's first, once the start's streaming has finished rather than
; beside it (the checkpoint saved every section as not loaded: Reload Last Checkpoint restored an empty world)
kismet_relink = SP_Prison_P/SeqEvent_LevelBeginning_1.Beginning of Level>SeqAct_MultiLevelStreaming_14.Finished:initialPlayerStuff
load_packages = MPCH_COGDomG2MP_SF, MPCH_COGMarcusG2MP_SF
; the Gears 3 packages whose characters are loaded with the chapter (Dom: GEARGAMESP_SF)
content = GEARGAMESP_SF
; carriers: Gears 3 levels streamed in (actors and scripts off) for the characters cooked into them: the campaign's
; Drone (GearPawn_LocustDroneSavage, Gears 1's Pawn_GeistLocust; the classic Drone is cooked only for Horde); the
; flashback Dom (SP_Nightmare_P)
carriers = SP_Airfield_02_S, SP_Nightmare_P, SP_Tower_P (P_Jack_ResOUT P_Jack_Jets), SP_Bridge_02b_S (M_Steam_smoke_thick)
; Gears 3's own copies of Gears 1 effects the chapter plays (held by the carriers above): Jack's jets and cloak as
; Gears 3 draws them, the bag dust's thick smoke. (The drool's M_Vapors_2, in the persistent level as the kit's and
; held there with persistent_hold, did not resolve from the cutscene's section: the drool keeps the smoke stand-in)
g3_effects = P_Jack_ResOUT = COG_BOT.Effects.P_Jack_ResOUT, P_Jack_Jets = COG_BOT.Effects.P_Jack_Jets,
             M_Steam_smoke_thick = War_Level_Effects.Materials.M_Steam_smoke_thick
; the cell's cover (S01, S01_Scripting) stands on the cell block's navmesh, whose pylon is S02_Scripting's: converted
; there (a player takes cover only through navmesh polygons' references, into the pylon's own package)
cover_into = SP_Prison_S01, SP_Prison_S01_Scripting -> SP_Prison_S02_Scripting
; levelinject options of every section
options = --bsp --replace --cover --kismet --merge

; navmesh regions: the region's geometry converted again into a multiplayer map's slot (20000 up), Gears 3's builder
; run there in the game, the mesh moved back down into the pylon of `section` (placed at pylon_at)
[navmesh cellblock]
; the cell block and the two routes out of it (Gears 1's route nodes as seeds: the easy route upstairs, the hard
; route below)
section = SP_Prison_S02_Scripting
pylon_at = 150,940,150
pylon_radius = 6000
pylons_at = -1441,1975,178;-4840,2200,982;-976,460,633;-2908,-8,971;-5096,1029,818
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_P, SP_Prison_S01, SP_Prison_S02, SP_Prison_S02_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=150,687,20272,16404
seconds = 900

[navmesh yard]
; the prison yard (S03, S04): the first fight, the easy route's upper corridor and the hard route's hallway (seeds:
; Gears 1's path node heights, 50 over the floor). Built in 150 s only the first pylon's mesh came out (the upper
; corridor): the hard hallway had no navmesh, so no cover (Gears 3 finds the player's cover through the navmesh
; polygons' cover references) and no mantle over its barrier
section = SP_Prison_S04_Scripting
pylon_at = -3170,4327,818
pylon_radius = 6000
pylons_at = -3324,2724,818;-3318,6380,818;-1600,3000,178;-1300,4200,178;-1250,5000,178;-1250,5600,178;-1602,6539,178
seeds_on_path_nodes = true
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
; (S05's geometry too: the hard hallway's far end, where its Drones spawn, stands on S05's floor; without it the
; builder found no ground there and the Drones never left their spawn point)
sources = SP_Prison_S02_Meshes, SP_Prison_S03, SP_Prison_S04, SP_Prison_S05, SP_Prison_S05_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=-3330,4215,20848,16384
seconds = 900

[navmesh s05]
; past the yard: the welding door, the easy route's way down on the west side (seeds: Gears 1's path nodes; in 150 s
; two of five pylons came out and the west side's cover had no mesh)
section = SP_Prison_S05_Scripting
pylon_at = -2528,8320,178
pylon_radius = 6000
pylons_at = -4288,6848,498;-3481,6743,821;-4720,6584,498;-3436,7663,178;-1490,8398,178;-946,8360,178;-2880,8868,494;-1632,8936,498
seeds_on_path_nodes = true
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_S05, SP_Prison_S05_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=-2496,8288,20356,0
seconds = 900

[navmesh s06]
; the last stretch to the prison's exit (seeds: Gears 1's path nodes, open floor; its cover links sit against
; objects, where the builder's scout cannot stand)
section = SP_Prison_S06_Scripting
pylon_at = 1640,7968,114
pylon_radius = 6000
pylons_at = 248,7776,114;2808,8488,146;4352,9016,130;1704,7472,136
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_S06, SP_Prison_S07, SP_Prison_World
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --starts-at=1456,8693,20254,0
seconds = 600  ; (a large outdoor area: the builder merges ~11000 polygons)
