; A host-side mod that builds on another: requires = names the mods it needs. Without "Horde: big bank" installed
; and on, the game leaves this one off and says why (in its log, the launcher's Mods tab and modtool.py mods).
; It loads after the bank (priority 1), so its fragment applies on top.
[mod]
name = Horde: interest
version = 1.0
author = gears3-pc
description = Your Horde savings earn 10% interest after each wave, in games you host (config\interest.ini).
priority = 1
enabled = true
side = host
requires = Horde: big bank
