; A mod everyone needs: the Lancer starts with more magazines and carries more spare ammunition, in the campaign and
; in multiplayer. Weapons are simulated by every player's game, so all the players of a session must have the same
; weapon settings (side = everyone): a player without it is turned away with the list of mods the session uses.
[mod]
name = Lancer ammo
version = 1.0
author = gears3-pc
description = The Lancer starts with 6 magazines and holds 720 spare rounds (config\lancer.ini).
priority = 0
enabled = true
side = everyone
