; Example mod: a new act "VI: Fragments" with one chapter (number 32) in Campaign > Standard > Select Chapter. Every
; player of a co-op session needs it (side = everyone): the host picks the chapter, the others load its map.
; It loads the prologue map (sp_nightmare_p) to show the mechanism; a real mod ships its own map package.
[mod]
name = Example: a new act and chapter
version = 1.0
author = gears3-pc
description = Adds Act VI with one chapter through a config fragment (config\chapter.ini).
priority = 0
enabled = true
side = everyone
