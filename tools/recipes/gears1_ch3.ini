; Gears of War 1, act 1 chapter 3 ("Fish in a Barrel": the House of Sovereigns), as a chapter of its own in Gears 3's
; campaign (Act VI chapter 3 in Select Chapter), from the player's own Gears of War 1 and Gears of War 3 discs:
;   python -P tools/trilogy.py build gears1_ch3
; (the shared settings as gears1_ch1.ini and gears1_ch2.ini, which explain them)

[mod]
folder = Gears1_Chapter3
name = Gears of War: Fish in a Barrel (trilogy)
version = 0.1
description = Gears of War 1's third chapter, the House of Sovereigns, from your Gears 1 disc: Act VI chapter 3 in Select Chapter.
side = everyone

[chapter]
number = 34
act = 6
act_title = Gears of War
title = Fish in a Barrel
location = House of Sovereigns
time = Emergence Day + 14 years
prefix = GOW1_
persistent = SP_HOS_P
; Gears 1's streaming list
sections = SP_HOS_S09c, SP_HOS_World, SP_HOS_S09, SP_HOS_S10, SP_HOS_S11, SP_HOS_S12, SP_HOS_S13, SP_HOS_S14,
           SP_HOS_S15, SP_HOS_S16, SP_HOS_S17, SP_HOS_S01, SP_HOS_S19, SP_HOS_S20, SP_HOS_S21,
           SP_HOS_S22, SP_HOS_S23, SP_HOS_S24, SP_HOS_S25, SP_HOS_S26, SP_HOS_S27, SP_HOS_S28, SP_HOS_S02,
           SP_HOS_S09b, SP_HOS_S08, SP_HOS_Scripting_1, SP_HOS_S00, SP_HOS_Scripting_2, SP_HOS_Scripting_3,
           SP_HOS_S00_hallway, SP_HOS_Scripting_1b, SP_HOS_S03, SP_HOS_Scripting_1c, SP_HOS_S04b,
           SP_HOS_Scripting_1_hallway, SP_HOS_Carmine_Death_Cine, SP_HOS_Scene1_CineLevel, SP_HOS_Scripting_4,
           SP_HOS_Audio, SP_HOS_S04, SP_HOS_S05, SP_HOS_S06, SP_HOS_S07
; sections no Kismet streams (Gears 1's LevelStreamingVolumes only: 27 in the persistent level)
; (SP_HOS_S18, in Gears 1's streaming list, is not on the disc)
always_loaded = SP_HOS_Scripting_1, SP_HOS_Scripting_2, SP_HOS_Scripting_3, SP_HOS_Scripting_4,
                SP_HOS_Audio
kit = SP_Nightmare_02_S
materials = MI_GR_Cliffwall_Tilable_01
skin_material = GEARGAMESP_SF: ALL_WeaponShaders.SinglePlayer.COG_WeaponShader_HOD_SP
max_texture = 512
max_character_texture = 1024
light_scale = 0.25
masked_template = SP_Azura2_02_S
masked_material = MI_COG_Collectibles_Azura
masked_sections = SP_HOS_S09c, SP_HOS_World, SP_HOS_S09, SP_HOS_S10, SP_HOS_S11, SP_HOS_S12, SP_HOS_S13, SP_HOS_S14,
                  SP_HOS_S15, SP_HOS_S16, SP_HOS_S17, SP_HOS_S01, SP_HOS_S19, SP_HOS_S20, SP_HOS_S21,
                  SP_HOS_S22, SP_HOS_S23, SP_HOS_S24, SP_HOS_S25, SP_HOS_S26, SP_HOS_S27, SP_HOS_S28, SP_HOS_S02,
                  SP_HOS_S09b, SP_HOS_S08, SP_HOS_S00, SP_HOS_S00_hallway, SP_HOS_S03, SP_HOS_S04b, SP_HOS_S04,
                  SP_HOS_S05, SP_HOS_S06, SP_HOS_S07
facefx_assets = marcus_FaceFX = MPCH_COGMarcusG2MP_SF: COG_MarcusFenix.marcus_FaceFX, Dom_FaceFX = MPCH_COGDomG2MP_SF: COG_Dom.Dom_FaceFX
hair_material = MPCH_COGDomG2MP_SF: COG_Dom.Game.M_Classic_Dom_Hair_Masked
section_template = SP_Char_Tower_1a_S
look = SP_Nightmare_P
pawn_classes = Pawn_COGDom=GearPawn_COGDomG2
; the persistent level's squad factories (Dom, Carmine, Minh: SpawnSquad) resolve their classes before the carriers load:
; classes of load_packages there (Carmine: Gears 3's multiplayer Anthony Carmine, Gears 1's; Minh: a multiplayer Redshirt)
persistent_pawn_classes = Pawn_COGDom=GearPawn_COGDomG2MP, Pawn_COGCarmine=GearPawn_COGCarmineMP, Pawn_COGMinh=GearPawn_COGRedshirtMP,
                          Pawn_COGGus=GearPawn_COGGusG2MP
; the player as Gears 3's classic Marcus once Hoffman's opening cutscene (HOFFMAN_CINEMATIC) ends
; (no opening cutscene: at the level's start; SP_HOS_Scene1_CineLevel's Matinee is a scene later, by remote event)
player_pawn = GearPawn_COGMarcusG2MP @ SP_HOS_P: SeqEvent_LevelBeginning_1: Beginning of Level
; where the classic one spawns: beside the chapter's player start (-1162,-8989,-176, yaw 90)
player_spawn_at = -1062,-8989,-150,90
load_packages = MPCH_COGDomG2MP_SF, MPCH_COGMarcusG2MP_SF, MPCH_COGCarmineMP_SF, MPCH_COGRedshirtMP_SF, MPCH_COGGusG2MP_SF
content = GEARGAMESP_SF
; the Drone (SP_Airfield_02_S); the flashback Dom and Ben Carmine (SP_Nightmare_P)
; and the Troika (Turret_TroikaCabal, with Gears 3's model and animations: SP_Airfield_01B_S)
; and the Wretch (GearPawn_LocustWretch: SP_Oldshipyard_05e_S)
; and the Hunters (GearPawn_LocustHunterArmorNoGrenades: SP_Airfield_03B_S; ...NoArmorNoGrenades:
; SP_Wreckage_01_S_CombatDBrumak). Gears 3 has no Nemacyst
carriers = SP_Airfield_02_S, SP_Nightmare_P, SP_Airfield_01B_S, SP_Oldshipyard_05e_S, SP_Airfield_03B_S,
           SP_Wreckage_01_S_CombatDBrumak
options = --bsp --replace --cover --kismet --merge

