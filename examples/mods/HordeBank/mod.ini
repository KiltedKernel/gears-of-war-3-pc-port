; A host-side mod: Horde starts with $5,000 instead of $1,000.
; These are settings of the game mode itself (GearGameHorde_Base), which only the host's game runs: in a Horde
; session the host's mods decide, and the other players need not have this one (side = host).
[mod]
name = Horde: big bank
version = 1.0
author = gears3-pc
description = Horde starts with $5,000 instead of $1,000, in games you host (config\horde.ini).
priority = 0
enabled = true
side = host
