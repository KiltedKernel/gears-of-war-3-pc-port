; Settings for gow3_server.exe: put this file next to it (or start it with --config <file>). The command line
; overrides any of them. docs/MULTIPLAYER.md and docs/MODDING.md describe the server and mods.
[server]
name = Example server
motd = This server plays with the Lancer ammo mod
port = 3074
max = 16
; password = secret
upnp = true
; a mods folder (relative to this file): its mods that are for everyone are the ones every player must have. Copy
; the mod folders players install (the server reads each mod.ini and the names and sizes of its files, the
; multiplayer fingerprint; it never loads them). Players with other mods, or without these, are turned away and told
; which mods the server uses. Mods for the host or for each player (side = host / client) are never required.
; Without a mods line, each room plays with the mods of the first player in it.
mods = mods
