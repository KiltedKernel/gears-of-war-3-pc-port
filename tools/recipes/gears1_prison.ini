; Gears of War 1's prison opening (the cell block, Dom, the opening cutscene) built into Gears 3's campaign, from the
; player's own Gears of War 1 and Gears of War 3 discs:  python -P tools/trilogy.py build gears1_prison
; Gears 3's prologue is a remake of this opening at the same coordinates: the converted cell block goes into the
; prologue's streaming sublevel SP_Nightmare_02_S (offset 0), and gears1_prison_campaign.txt edits the Gears 3
; packages around it. While the mod is on, Campaign > New starts Gears 1's opening instead of Gears 3's prologue.

[mod]
folder = Gears1_Prison
name = Gears of War: the prison (trilogy preview)
version = 0.1
description = Gears of War 1's opening, from your Gears 1 disc, in Gears 3's campaign (it replaces the prologue).
; the converted level is a package: every player of a co-op session needs the same one
side = everyone

[convert]
target = SP_Nightmare_02_S
; Gears 1 packages (WarGame\CookedXenon): the persistent level, the cell block's sublevels, their audio, the opening
sources = SP_Prison_P, SP_Prison_S01, SP_Prison_S01_Scripting, SP_Prison_S02, SP_Prison_S02_Meshes,
          SP_Prison_S02_Scripting, SP_Prison_Audio, SP_Prison_S01_Audio, SP_Prison_S02_Audio, SP_Prison_Cine_Start
options = --materials MI_GR_Cliffwall_Tilable_01 --bsp --replace --cover --environment --kismet --offset 0,0,0
          --pylon-at=150,940,150 --pylon-radius 6000

[navmesh]
; generated by Gears 3's own navmesh builder, in the game. The builder finds no ground in a streamed campaign
; sublevel, so the cell block's geometry is converted a second time into a multiplayer map's slot (the map's own
; level), 20000 units up with its pylon at the campaign pylon's place; the game loads it there, the mesh it builds is
; moved back down and written into the campaign package. The slot's pylon must have the campaign pylon's name
; (Pylon_1 in both).
slot = MP_GridlockG3
url = MP_GridlockG3?game=GearGameContent.GearGameHorde?listen
offset = 0,0,20000
sources = SP_Prison_P, SP_Prison_S01, SP_Prison_S02, SP_Prison_S02_Meshes
options = --template GothPillar_Short --materials MI_Locust_Shield --bsp --replace --cover --offset 0,0,20000
          --pylon-at=150,940,20150 --pylon-radius 6000 --starts-at=150,687,20272,16404
seconds = 120

[patch]
recipe = gears1_prison_campaign.txt
